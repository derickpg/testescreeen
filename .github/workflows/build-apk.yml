name: Build AutoMirrorLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          
      - name: Configure Android SDK
        run: |
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
            echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      
      - name: Install Android SDK packages
        run: |
                SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
      
                "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
      
                "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
                  "platform-tools" \
                  "platforms;android-35" \
                  "build-tools;35.0.0"

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager não encontrado em: $SDKMANAGER"
            echo "Conteúdo de cmdline-tools:"
            ls -la "$ANDROID_HOME/cmdline-tools/" || true
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Grant execute permission to Gradle wrapper
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          else
            echo "Erro: gradlew não encontrado na raiz do projeto."
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoMirrorLab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
